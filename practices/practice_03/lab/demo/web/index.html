<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notify Mini</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>Управление подписками</h1>
      <form id="add-form">
        <input id="name" placeholder="Имя" />
        <button>Добавить</button>
        <span id="status"></span>
      </form>
      <input id="filter" placeholder="Фильтр" />
      <section id="controls">
        <label>Сортировка:
          <select id="sort">
            <option value="asc">По возрастанию</option>
            <option value="desc">По убыванию</option>
          </select>
        </label>
        <span id="hints" class="hint"></span>
      </section>
      <div id="summary"></div>
      <ul id="list"></ul>
      <nav id="pager">
        <button data-act="first">|&lt;</button>
        <button data-act="prev">&lt;</button>
        <span id="pages"></span>
        <button data-act="next">&gt;</button>
        <button data-act="last">&gt;|</button>
      </nav>
      <div id="error" role="alert"></div>
    </main>
    <script src="/script.js"></script>
  </body>
</html>
